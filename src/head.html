<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>강의슬라이드</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink3:#4B5563;--ink:#1C2026;--ink2:#2A3038;--line:#D9DDE3;--bg:#EEF0F3;--panel:#fff;--mark:#E23B2E;--hl:#FFE066;--acc:#2563EB;--sel:#F97316;--mut:#4B5563}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.4 "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
body.aud-mode #app{display:none}
#aud{display:none}
body.aud-mode #aud{display:block}
#app{display:grid;grid-template-columns:var(--lw,182px) 5px minmax(0,1fr) 5px var(--rw,272px);grid-template-rows:auto 1fr;height:100vh}
#top{grid-column:1/-1}
#thumbs{grid-column:1;grid-row:2}#rzL{grid-column:2;grid-row:2}#center{grid-column:3;grid-row:2}#rzR{grid-column:4;grid-row:2}#inspector{grid-column:5;grid-row:2}
.rz{cursor:col-resize;background:var(--line);opacity:.55;transition:background .12s,opacity .12s;touch-action:none}.rz:hover,.rz.drag{background:var(--acc);opacity:1}
body.lc #thumbs,body.lc #rzL,body.rc #inspector,body.rc #rzR{display:none}
#thumbs .ops.sz{padding:0 0 6px;position:static;top:auto}#thumbs .ops.sz button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
#thumbs .ops{flex-direction:row}
#top{grid-column:1/-1;background:#F4F5F7;color:#1C2026;border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;padding:5px 10px;min-height:46px;min-width:0}
#top .logo{font-weight:700;letter-spacing:-.02em;margin-right:6px;white-space:nowrap}
#top input#title{background:#fff;border:1px solid #C4CAD3;border-radius:6px;color:#1C2026;padding:5px 8px;width:120px;min-width:60px;flex:0 1 120px;user-select:text}
#top button{background:#fff;border:1px solid #C4CAD3;border-radius:6px;color:#1C2026;padding:5px 7px;white-space:nowrap}
#top button:hover{background:#FFF1E6;border-color:#F97316}
#top button.go{background:var(--mark);border-color:var(--mark);color:#fff;font-weight:600}
#top select{background:#fff;border:1px solid #C4CAD3;border-radius:6px;color:#1C2026;padding:4px 6px}
.grp{display:inline-flex;gap:4px;align-items:center}
#top .sp{flex:1}
#top button.pri{background:#1C2026;border-color:#1C2026;color:#fff;font-weight:600}#top button.pri:hover{background:#000;border-color:#000}
#expMenu{position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid #C4CAD3;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column;gap:2px;z-index:3500;min-width:130px}
#expMenu[hidden]{display:none}#expMenu button{text-align:left;border:0!important;background:none!important;padding:6px 10px!important}#expMenu button:hover{background:#FFF1E6!important}
.ti{vertical-align:-2px;margin-right:4px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
button:focus:not(:focus-visible){outline:none}
.boxsec{border-left:3px solid var(--sel);padding-left:8px;margin:6px 0}.boxsec .rl{margin-top:0}
.rl{display:block;font-size:11px;color:var(--mut);margin:6px 0 -2px}
details.alg{margin:8px 0;border:1px solid var(--line);border-radius:6px;padding:0 8px 6px}details.alg summary{cursor:pointer;font-weight:600;padding:6px 0}details.alg h4{margin-top:6px}
#top .sep{width:1px;height:20px;background:#C4CAD3;margin:0 4px}
#dirty{color:#C2410C;font-weight:600;font-size:13px;min-width:56px}
#thumbs{background:#F7F8FA;border-right:1px solid var(--line);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
#thumbs .ops{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:-8px;background:#F7F8FA;padding:2px 0 6px;z-index:2}
#thumbs .ops button[data-op=add]{color:#15803D;border-color:#86C99B}#thumbs .ops button[data-op=add]:hover{background:#ECFDF3}#thumbs .ops button[data-op=del]{color:#DC2626;border-color:#F0A8A8}#thumbs .ops button[data-op=del]:hover{background:#FEF2F2}#thumbs .ops button svg{display:block;margin:0 auto}
#thumbs .ops button{flex:1;min-width:24px;padding:4px 0;border:1px solid var(--line);background:#fff;border-radius:6px}
.th{position:relative;border:2px solid transparent;border-radius:6px;padding:2px;cursor:pointer}
.th.on{border-color:var(--sel);background:#FFF1E6}
.th.over{border-top:3px solid var(--acc)}
.th .n{position:absolute;left:-2px;top:-2px;background:var(--ink);color:#fff;font-size:11px;padding:0 5px;border-radius:5px 0 5px 0;z-index:1}
.tbox{width:var(--tw,152px);height:var(--thH,85.5px);overflow:hidden;position:relative;background:#fff;box-shadow:0 0 0 1px var(--line)}
.troot{transform:scale(var(--ts,.11875));transform-origin:0 0;pointer-events:none}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#toolbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:6px 8px;flex-wrap:wrap}
#toolbar .tb{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;white-space:nowrap}
#toolbar .tb.on{background:var(--sel);color:#fff;border-color:var(--sel);font-weight:700;box-shadow:0 0 0 3px rgba(249,115,22,.3)}
#toolbar .ur{border:1px solid #C4CAD3;background:#fff;border-radius:6px;padding:4px 10px;font-weight:600;white-space:nowrap}#toolbar .ur:hover{background:#FFF1E6;border-color:var(--sel)}
#toolbar .tb.on small{opacity:.85}
#toolbar .tb small{opacity:.6;margin-left:3px}
#toolbar .vs{width:1px;height:26px;background:var(--line);margin:0 6px}
#favs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.fav{position:relative;width:48px;height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px}
.fav:hover{border-color:var(--sel)}
.fav svg{width:100%;height:100%;display:block}
.fav b{position:absolute;right:2px;bottom:0;font-size:10px;color:var(--mut)}
.arow{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.arow button{flex:1;min-width:48px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:#F7F8FA;font-size:13px}
.arow.ic button{min-width:36px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px 3px}
.arow.ic button span{font-size:10px;line-height:1.1;white-space:nowrap;color:#444}
.arow.ic svg{width:22px;height:22px;display:block}
.tglrow{display:flex;gap:4px;align-items:center;margin:4px 0 6px}
.tglrow button{min-width:30px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 6px}
.tglrow button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.decrow{margin-bottom:2px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 9px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:2px}
.chip:hover{border-color:var(--acc)}.chip.add{border-style:dashed;color:var(--acc)}
.chip.my{padding:0;gap:0;overflow:hidden;background:#EEF4FF;border-color:#BFD2FF}.chip.my button{border:0;background:none;padding:2px 6px;font-size:13px;cursor:pointer}.chip.my .cx{padding:2px 3px;color:#6b7280}.chip.my .cx:hover{color:#E23B2E}
#detBox{margin:6px 0;border:1px solid var(--line);border-radius:6px;padding:2px 8px 4px}#detBox summary{cursor:pointer;font-size:13px;color:#556;padding:3px 0}
.tglrow .tsep{width:1px;height:20px;background:var(--line);margin:0 3px}
.chk{display:flex;gap:6px;align-items:center;margin:6px 0;color:#444}
#zoomBox{margin-left:auto;display:flex;gap:4px;align-items:center}
#zoomBox button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px}
#zoomBox button.on{background:#FFF1E6;color:#C2410C;border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel);font-weight:700}
#zPct{width:56px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:#fff;user-select:text}
.arow button:hover{border-color:var(--acc);background:#EEF3FF}
.fav.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel);background:#FFF1E6}
#stTool{color:#C2410C;font-weight:700}
.cbtn{width:44px;height:24px;border:1px solid #9CA3AF;border-radius:4px;padding:0}
.cbtn:hover{border-color:var(--acc)}
.rg{display:flex;gap:6px;align-items:center}
.rg input[type=range]{flex:1;min-width:0}
.rn{width:58px!important;flex:none}
#cpop{position:fixed;z-index:3500;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.cp-t{font-size:11px;color:var(--mut);margin:6px 0 3px}
.cp-t:first-child{margin-top:0}
.cp-g{display:grid;grid-template-columns:repeat(10,22px);gap:3px}
.sw{width:22px;height:22px;border:1px solid rgba(0,0,0,.2);border-radius:3px;padding:0}
.sw:hover{transform:scale(1.15)}
.sw.on{outline:2px solid var(--acc);outline-offset:1px}
.cp-more{margin-top:8px;width:100%;padding:5px;border:1px solid var(--line);border-radius:6px;background:#F7F8FA}
.cp-native{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.favbtn{border:1px dashed #9CA3AF;background:#fff;border-radius:6px;padding:4px 8px;color:var(--mut)}
#viewport{flex:1;position:relative;background:#CBD0D8;overflow:hidden;min-height:0}
#mbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;background:#7C3AED;color:#fff;padding:5px 8px 5px 14px;border-radius:20px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#mbar[hidden]{display:none}
#mbar button{border:1px solid #fff;background:transparent;color:#fff;border-radius:14px;padding:2px 10px}
body.mm #thumbs{pointer-events:none;opacity:.4}
body.mm #viewport{background:#D9CFF0}
.l-mimg{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px);pointer-events:none}
.l-mimg img{position:absolute;display:block;box-sizing:border-box}
.l-mann{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px);pointer-events:none;overflow:visible}
#boxOuter{position:absolute;box-shadow:0 6px 28px rgba(0,0,0,.28)}
#box{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px);transform-origin:0 0;background:#fff;cursor:crosshair}
#box.sel{cursor:default}
#stage{position:absolute;inset:0;pointer-events:none}
#stage.edit{pointer-events:auto}
#ui{position:absolute;inset:0;width:1280px;height:var(--H,720px);pointer-events:none;overflow:visible}
#status{background:#fff;border-top:1px solid var(--line);padding:4px 10px;color:var(--mut);display:flex;gap:14px;font-size:13px}
#status span{white-space:nowrap}
#stHint{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#inspector{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:10px 12px}
#inspector h4{margin:12px 0 6px;font-size:13px;color:var(--mut);font-weight:600}
#inspector h4:first-child{margin-top:0}
.fstat{margin:6px 0;padding:6px 8px;background:#F7F8FA;border:1px solid var(--line);border-radius:6px}.modal.folder{width:min(520px,92vw)}
#top button.on{box-shadow:inset 0 0 0 2px #22c55e}
.fld{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;margin:5px 0}
.fld label{color:#444}
.fld input[type=range]{width:100%}
.fld input[type=color]{width:44px;height:24px;padding:0;border:1px solid var(--line);background:none}
.fld select,.fld input[type=number]{width:100%;padding:3px 4px;border:1px solid var(--line);border-radius:5px}
.btn{width:100%;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:6px;background:#F7F8FA}
.btn:hover{border-color:var(--acc)}
.hint{color:var(--mut);font-size:13px;margin:4px 0}
#inspector textarea{width:100%;height:96px;border:1px solid var(--line);border-radius:6px;padding:6px;resize:vertical;user-select:text}
.te{position:absolute;margin:0;border:2px solid var(--acc);outline:none;resize:none;overflow:hidden;background:#fff;color:#000;user-select:text;z-index:5;line-height:1.25;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
/* 슬라이드 내부 레이어 */
.l-bg,.l-img,.l-frame,.l-mos,.l-ann,.l-ink{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px)}
.l-img img{position:absolute;display:block;box-sizing:border-box}
.l-bg,.l-img,.l-mos,.l-ann,.l-ink{pointer-events:none}
.l-ann,.l-ink{overflow:visible}
.html-frame{width:1280px;height:var(--H,720px);border:0;background:#fff;display:block}
.thumb-img{width:1280px;height:var(--H,720px);display:block}
.thumb-html{width:1280px;height:var(--H,720px);background:#EEF1F6;color:#6B7280;font:700 120px/var(--H,720px) sans-serif;text-align:center}
/* 모달/토스트 */
.mback{position:fixed;inset:0;background:rgba(15,18,24,.5);z-index:3000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:10px;padding:18px 20px;min-width:360px;max-width:min(720px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);user-select:text}
.modal h3{margin:0 0 10px;font-size:16px}
.modal .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .row button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:#F7F8FA}
.modal .row button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal textarea{width:100%;height:160px;border:1px solid var(--line);border-radius:6px;padding:6px;font:12px/1.4 Consolas,monospace}
.modal input[type=text]{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px}
.modal table{border-collapse:collapse;width:100%}
.modal td,.modal th{padding:4px 8px;border-bottom:1px solid #eee;text-align:left;font-weight:400}
.modal kbd{background:#F1F3F5;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px Consolas,monospace}
.plist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.plist .it{display:flex;gap:6px;align-items:center}
.plist .it svg{width:48px;height:32px;border:1px solid var(--line);border-radius:5px;flex:none}
.plist .it input{flex:1}
.plist .it button{padding:2px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(28,32,38,.94);color:#fff;padding:8px 16px;border-radius:20px;z-index:4000;pointer-events:none;opacity:0;transition:opacity .2s;max-width:80vw}
#toast.on{opacity:1}
#banner,#banner2{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:#FFF7D6;border:1px solid #E8C94A;border-radius:8px;padding:8px 14px;z-index:2500;display:flex;gap:10px;align-items:center}
#banner button,#banner2 button{padding:3px 10px;border:1px solid #C9A92B;border-radius:5px;background:#fff}
/* 캡처 오버레이 */
#cap{position:fixed;inset:0;background:#000;z-index:2800;cursor:crosshair;user-select:none}
#cap video{position:absolute;left:0;top:44px;width:100%;height:calc(100% - 44px);object-fit:contain;background:#000}
#cap .capbar{position:absolute;left:0;right:0;top:0;height:44px;background:#1C2026;color:#fff;display:flex;gap:14px;align-items:center;padding:0 14px;cursor:default}
#cap .capbar span{color:#9CA3AF;font-size:13px}
#cap .capbar button{padding:4px 10px;border-radius:6px;border:1px solid #4b5563;background:#2A3038;color:#fff}
#cap .capsel{position:absolute;border:2px solid #38BDF8;background:rgba(56,189,248,.14);display:none;pointer-events:none}
#cap .flash{position:absolute;inset:44px 0 0 0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
/* 발표 */
#pres{position:fixed;inset:0;background:#000;z-index:2000;display:flex;color:#fff}
#pres[hidden]{display:none}
#pmain{flex:1;position:relative;min-width:0;overflow:hidden}
#pboxOuter{position:absolute}
#pbox{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px);transform-origin:0 0;background:#fff;overflow:hidden}
#pstage{position:absolute;inset:0}
#pink{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px);overflow:visible;pointer-events:none}
#pink.on{pointer-events:auto}
#plaser,#audLaser{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle,#ff2a2a 0 35%,rgba(255,42,42,.45) 60%,rgba(255,42,42,0) 72%);pointer-events:none;display:none}
#pblank,#audBlank{position:absolute;inset:0;display:none}
#pside{width:310px;background:#14171B;border-left:1px solid #2A3038;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
#pres.single #pside{display:none}
#ptimer{font:700 34px/1 Consolas,monospace;letter-spacing:.02em}
#pnext{width:286px;height:161px;overflow:hidden;position:relative;background:#222;border-radius:4px}
#pnext .r{transform:scale(.2234);transform-origin:0 0}
#pnotes{flex:1;min-height:120px;background:#1C2026;border:1px solid #2A3038;border-radius:6px;padding:8px;color:#E5E7EB;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow:auto;user-select:text}
#pside .cap{color:#9CA3AF;font-size:13px}
#pside button{padding:5px 9px;border:1px solid #3a424c;border-radius:6px;background:#2A3038;color:#fff}
#ptools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:34px 0 12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#ptools:hover,#pres.presenter #ptools{opacity:1}
#ptools .bar{pointer-events:auto;background:rgba(28,32,38,.95);border:1px solid #3a424c;border-radius:10px;padding:5px 8px;display:flex;gap:4px;align-items:center}
#ptools button{border:1px solid transparent;background:transparent;color:#fff;padding:4px 8px;border-radius:6px}
#ptools button.on{background:var(--mark);border-color:var(--mark)}
#ptools .c{width:18px;height:18px;border-radius:50%;padding:0;border:2px solid #fff}
#ptools .c.on{box-shadow:0 0 0 2px var(--mark)}
#ptools .vs{width:1px;height:20px;background:#4b5563;margin:0 4px}
#pcount{position:absolute;right:10px;top:8px;color:#9CA3AF;font-size:13px;z-index:5;background:rgba(0,0,0,.4);padding:1px 8px;border-radius:10px}
/* 청중 창 */
#aud{position:fixed;inset:0;background:#000;overflow:hidden}
#audBoxOuter{position:absolute}
#audBox{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px);transform-origin:0 0;background:#fff;overflow:hidden}
#audStage{position:absolute;inset:0}
#audInk{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px);overflow:visible;pointer-events:none}
#audMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:22px;text-align:center;line-height:1.6;z-index:3}
#printRoot{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #app,#pres,#modals,#toast,#banner,#banner2,#cap,#cpop,#aud{display:none!important}
  #printRoot{display:block}
  .pp{width:1280px;height:var(--H,720px);position:relative;overflow:hidden;break-after:page;page-break-after:always}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .pp.notes{width:auto;height:auto;overflow:visible}
  .pp.notes .ph{width:700px;height:var(--phH,393.75px);overflow:hidden;border:1px solid #bbb}
  .pp.notes .ph>div{transform:scale(.546875);transform-origin:0 0}
  .pp.notes .pn{margin-top:14px;font:13pt/1.6 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;white-space:pre-wrap;color:#111}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="logo">강의슬라이드</span>
    <input id="title" value="제목 없는 강의" title="프로젝트 이름">
