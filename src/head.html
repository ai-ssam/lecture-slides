<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink3:#4B5563;--ink:#1C2026;--ink2:#2A3038;--line:#D9DDE3;--bg:#EEF0F3;--panel:#fff;--mark:#E23B2E;--hl:#FFE066;--acc:#2563EB;--sel:#F97316;--mut:#4B5563}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.4 "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
body.aud-mode #app{display:none}
#aud{display:none}
body.aud-mode #aud{display:block}
#app{display:grid;grid-template-columns:var(--lw,182px) 5px minmax(0,1fr) 5px var(--rw,272px);grid-template-rows:auto 1fr;height:100vh}
#top{grid-column:1/-1}
#thumbs{grid-column:1;grid-row:2}#rzL{grid-column:2;grid-row:2}#center{grid-column:3;grid-row:2}#rzR{grid-column:4;grid-row:2}#inspector{grid-column:5;grid-row:2}
.rz{cursor:col-resize;background:var(--line);opacity:.55;transition:background .12s,opacity .12s;touch-action:none}.rz:hover,.rz.drag{background:var(--acc);opacity:1}
body.lc #thumbs,body.lc #rzL,body.rc #inspector,body.rc #rzR{display:none}
.hdl{position:fixed;top:50%;z-index:60;transform:translateY(-50%)}
#hL{left:calc(var(--lw,0px) + 5px)}#hR{right:calc(var(--rw,0px) + 5px)}
body.lc #hL{left:0}body.rc #hR{right:0}
.hdl .hb{display:flex;align-items:center;justify-content:center;width:20px;height:72px;border:1px solid #9AA3B2;background:#fff;color:#3A4352;padding:0;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.hdl .hb svg{width:12px;height:12px;pointer-events:none}
#hL .hb{border-radius:0 9px 9px 0;border-left:0}#hR .hb{border-radius:9px 0 0 9px;border-right:0}
.hdl .hb:hover{background:var(--sel);color:#fff;border-color:var(--sel)}
.hdl .hb:active{filter:brightness(.92)}
body.ovl #hL{left:var(--lwf)}body.ovr #hR{right:var(--rwf)}
body.ovl #thumbs{display:flex;position:fixed;left:0;top:var(--hh,46px);bottom:0;width:var(--lwf);z-index:50;box-shadow:4px 0 18px rgba(0,0,0,.22)}
body.ovr #inspector{display:block;position:fixed;right:0;top:var(--hh,46px);bottom:0;width:var(--rwf);z-index:50;box-shadow:-4px 0 18px rgba(0,0,0,.22)}
#toolbar .fold{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;color:#556;white-space:nowrap}#toolbar .fold:hover{border-color:var(--sel);color:var(--sel)}
#toolbar{flex-direction:column;align-items:stretch;gap:4px;flex-wrap:nowrap}
#toolbar .trow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#toolbar .fold{margin-left:auto;display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:4px 7px;font-size:12px}
#toolbar .fold svg{width:14px;height:14px}
#rowF #zoomBox{margin-left:auto}#rowF #zoomBox+.fold{margin-left:6px}
body.tc #rowT .tb,body.tc #rowT>.vs{display:none}
body.fc #rowF #favs{display:none}
body.aud-mode .hdl{display:none}
#viewport,#box,#pres{touch-action:none}
#box{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body.nocap .grp:has(#bCap){display:none}
body.touch #toolbar .tb,body.touch #toolbar .ur,body.touch #toolbar .fold,body.touch #zoomBox button{min-height:40px}
body.touch .hdl .hb{width:26px;height:80px}
body.narrow #bHelp,body.narrow #bPptx,body.narrow #bFolder,body.narrow #bOpenFolder,body.narrow #bSnap{display:none!important}
body.narrow #top{padding:4px 6px;gap:3px 4px}body.narrow #top .logo{display:none}body.narrow #title{width:110px}
body.narrow.ovl #thumbs{width:min(var(--lwf),84vw)}body.narrow.ovr #inspector{width:min(var(--rwf),88vw)}
body.narrow.ovl #hL{left:min(var(--lwf),84vw)}body.narrow.ovr #hR{right:min(var(--rwf),88vw)}
body.narrow #app{grid-template-columns:0 0 minmax(0,1fr) 0 0}
body.touch .grp:has(#bCap){display:none}
#recBox .rec{display:flex;justify-content:space-between;gap:14px;width:100%}#recBox .rec{min-width:260px}#recBox .rn{flex:1;min-width:0;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#recBox .rt{color:var(--mut);font-size:12px;white-space:nowrap}
#recBox .rnone{padding:6px 12px;color:var(--mut);font-size:13px}#recBox .rsep{height:1px;background:var(--line);margin:4px 0}#recClear{color:#B42318}
#pgNav{display:none;align-items:center;gap:6px}#pgNav button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 12px;font-size:14px}#pgNav b{min-width:44px;text-align:center}
body.narrow #pgNav{display:inline-flex}body.narrow #stHint,body.narrow #stPos{display:none}
body.narrow #status{padding:4px 8px;justify-content:space-between}body.narrow #pgNav button{padding:6px 18px}
body.narrow #bPresenter,body.narrow #dirty,body.narrow #zoomBox .vs,body.narrow #zOut,body.narrow #zIn,body.narrow #z100{display:none}
